[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coronary-4d-tree-generator"
version = "1.0.0"
description = "Population-derived LCA tree generation with controlled disease and cardiac motion"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.13,<2",
  "scikit-image>=0.24,<1",
  "matplotlib>=3.8,<4",
  "pyvista>=0.43,<1",
  "plotly>=5.18,<7",
  "pillow>=10,<13",
  "python-docx>=1.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
coronary4d = "vessel_tree_generator.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = [
  "vessel_tree_generator*",
  "pca_ssm_vessel_tree_generator*",
]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
