name: verification

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: README images
        run: python tools/verify_readme_assets.py
      - name: Compile
        run: python -m compileall -q vessel_tree_generator pca_ssm_vessel_tree_generator tests tools
      - name: Dependency check
        run: python -m pip check
